# This workflow lints, tests, and builds a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Test
      run: go test ./... -race -cover

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: go get .

    - name: Build
      run: go build -o ./out/service -ldflags="-w -s" .

  sqlc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install sqlc
      uses: sqlc-dev/setup-sqlc@v5
      with:
        sqlc-version: '1.27.0'

    - name: Check generated code is up to date
      run: |
        sqlc generate
        git diff --exit-code internal/db/sqlc
